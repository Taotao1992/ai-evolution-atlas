<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="title desc"><title id="title">2022–2024 / A model in an action loop</title><desc id="desc">Tools and observations change the environment and the context. Stop conditions bound the loop.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#dec789"/></marker></defs><rect width="800" height="290" fill="#101b21"/><g font-family="ui-monospace,monospace" font-weight="400"><text x="30" y="35" font-size="11" fill="#dec789" text-anchor="start">2022–2024 / A MODEL IN AN ACTION LOOP</text><line x1="30" y1="53" x2="770" y2="53" stroke="#263b3e" stroke-width="1" /><rect x="50" y="110" width="145" height="70" rx="4" stroke="#84c9d0" stroke-opacity=".6" fill="#122129"/><text x="122.5" y="150.0" font-size="15" fill="#84c9d0" text-anchor="middle">Observe</text><line x1="205" y1="145" x2="278" y2="145" stroke="#dec789" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="290" y="110" width="155" height="70" rx="4" stroke="#c6a4f4" stroke-opacity=".6" fill="#122129"/><text x="367.5" y="150.0" font-size="15" fill="#c6a4f4" text-anchor="middle">Choose action</text><line x1="455" y1="145" x2="528" y2="145" stroke="#dec789" stroke-width="1.3" marker-end="url(#arrow)"/><rect x="540" y="110" width="190" height="70" rx="4" stroke="#bfd976" stroke-opacity=".6" fill="#122129"/><text x="635.0" y="150.0" font-size="15" fill="#bfd976" text-anchor="middle">Use a tool</text><path d="M635 192 V226 H123 V192" stroke="#dec789" fill="none" marker-end="url(#arrow)"/><text x="380" y="218" font-size="11" fill="#899e9b" text-anchor="middle">result → state → next step</text><text x="30" y="269" font-size="10" fill="#899e9b" text-anchor="start">Tools and observations change the environment and the context. Stop conditions bound the loop.</text></g></svg>