<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" role="img" aria-labelledby="title desc"><title id="title">1950 / The imitation game</title><desc id="desc">A proposed behavioral test. A test always leaves some abilities unmeasured.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#dec789"/></marker></defs><rect width="800" height="290" fill="#101b21"/><g font-family="ui-monospace,monospace" font-weight="400"><text x="30" y="35" font-size="11" fill="#dec789" text-anchor="start">1950 / THE IMITATION GAME</text><line x1="30" y1="53" x2="770" y2="53" stroke="#263b3e" stroke-width="1" /><rect x="45" y="110" width="155" height="72" rx="4" stroke="#dec789" stroke-opacity=".6" fill="#122129"/><text x="122.5" y="146.0" font-size="15" fill="#dec789" text-anchor="middle">Human judge</text><text x="122.5" y="168.0" font-size="10" fill="#899e9b" text-anchor="middle">observes text</text><rect x="330" y="82" width="170" height="64" rx="4" stroke="#dec789" stroke-opacity=".6" fill="#122129"/><text x="415.0" y="119.0" font-size="15" fill="#dec789" text-anchor="middle">Human</text><rect x="330" y="164" width="170" height="64" rx="4" stroke="#84c9d0" stroke-opacity=".6" fill="#122129"/><text x="415.0" y="201.0" font-size="15" fill="#84c9d0" text-anchor="middle">Machine</text><line x1="210" y1="145" x2="315" y2="114" stroke="#dec789" stroke-width="1.3" marker-end="url(#arrow)"/><line x1="210" y1="151" x2="315" y2="197" stroke="#dec789" stroke-width="1.3" marker-end="url(#arrow)"/><text x="555" y="132" font-size="19" fill="#e4ebe4" text-anchor="start">Can the judge</text><text x="555" y="160" font-size="19" fill="#dec789" text-anchor="start">tell them apart?</text><text x="30" y="269" font-size="10" fill="#899e9b" text-anchor="start">A proposed behavioral test. A test always leaves some abilities unmeasured.</text></g></svg>